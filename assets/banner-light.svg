<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="cheburnexus-bench: Honest call-graph accuracy benchmark">
  <title>cheburnexus-bench</title>
  <defs>
    <marker id="arrow-l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a97a8"/>
    </marker>
    <marker id="arrow-l-hit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fed"/>
    </marker>
    <marker id="arrow-l-miss" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/>
    </marker>
  </defs>

  <text x="72" y="140" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="700" fill="#14161b">cheburnexus-bench</text>
  <text x="72" y="182" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#54606d">Honest call-graph accuracy benchmark</text>

  <!-- graph motif: caller/callee edges, one confirmed (blue), one unmatched (dashed orange) -->
  <g stroke-width="2" fill="none">
    <line x1="808" y1="86" x2="928" y2="60" stroke="#8a97a8" marker-end="url(#arrow-l)"/>
    <line x1="808" y1="86" x2="858" y2="168" stroke="#2f6fed" marker-end="url(#arrow-l-hit)"/>
    <line x1="928" y1="60" x2="1058" y2="96" stroke="#8a97a8" marker-end="url(#arrow-l)"/>
    <line x1="858" y1="168" x2="1000" y2="156" stroke="#8a97a8" marker-end="url(#arrow-l)"/>
    <line x1="858" y1="168" x2="938" y2="234" stroke-dasharray="6 5" stroke="#e8590c" marker-end="url(#arrow-l-miss)"/>
    <line x1="1000" y1="156" x2="1110" y2="204" stroke="#8a97a8" marker-end="url(#arrow-l)"/>
  </g>
  <g fill="#ffffff" stroke="#2f6fed" stroke-width="2.5">
    <circle cx="808" cy="86" r="9"/>
    <circle cx="928" cy="60" r="9"/>
    <circle cx="1058" cy="96" r="9"/>
    <circle cx="858" cy="168" r="9"/>
    <circle cx="1000" cy="156" r="9"/>
    <circle cx="938" cy="234" r="9" stroke="#e8590c"/>
    <circle cx="1110" cy="204" r="9"/>
  </g>
</svg>
